name: VayaGo Daily Fare Alert

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  scan-and-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VayaGo Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Scan Ryanair & Send Daily Digest
        env:
          RESEND_API_KEY2: ${{ secrets.RESEND_API_KEY2 }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python send_digest.py